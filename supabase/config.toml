
[functions.send-whatsapp]
enabled = true
verify_jwt = true
import_map = "./functions/send-whatsapp/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-whatsapp/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-whatsapp/*.html" ]

[functions.whatsapp-webhook]
enabled = true
verify_jwt = true
import_map = "./functions/whatsapp-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/whatsapp-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/whatsapp-webhook/*.html" ]

# ── ADD these blocks to your existing supabase/config.toml ───────────────────

[functions.appointment-reminders]
enabled    = true
verify_jwt = false          # cron pg_net calls don't send a JWT
import_map = "./functions/appointment-reminders/deno.json"
entrypoint = "./functions/appointment-reminders/index.ts"

# Required secrets (set in Supabase Dashboard → Edge Functions → Secrets):
#   SUPABASE_URL              — already present by default
#   SUPABASE_SERVICE_ROLE_KEY — already present by default
#   SUPABASE_ANON_KEY         — already present by default
#   WHATSAPP_TOKEN            — your Meta Graph API token
#   WHATSAPP_PHONE_NUMBER_ID  — your Meta phone number ID
